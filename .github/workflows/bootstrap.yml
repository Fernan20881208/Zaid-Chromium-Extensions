name: Zaid Chromium Extensions Bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3 curl unzip ninja-build

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Prepare workspace
        run: |
          mkdir -p chromium
          echo "Chromium workspace ready"

      - name: Status
        run: |
          echo "Next phase: fetch Chromium and apply Zaid patches"
