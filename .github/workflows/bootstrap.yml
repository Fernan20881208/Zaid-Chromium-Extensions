name: Validate source and patches
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify pinned upstream and apply patches
        run: python3 scripts/source_contract.py --output dist/source-check.json
      - name: Runner capacity report
        run: python3 scripts/preflight.py --report-only
      - uses: actions/upload-artifact@v4
        with:
          name: source-validation
          path: dist/source-check.json
          if-no-files-found: error
