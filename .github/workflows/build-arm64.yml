name: Build Zaid Chromium Extensions ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3 curl unzip ninja-build openjdk-17-jdk

      - name: Prepare workspace
        run: |
          mkdir -p chromium
          echo "Chromium source preparation stage"

      - name: Configure build metadata
        run: |
          mkdir -p out/arm64
          cat > out/arm64/args.gn <<'EOF'
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          is_official_build = true
          symbol_level = 0
          enable_extensions_core = true
          enable_desktop_android_extensions = true
          EOF

      - name: Upload build configuration
        uses: actions/upload-artifact@v4
        with:
          name: zaid-chromium-arm64-config
          path: out/arm64/args.gn
